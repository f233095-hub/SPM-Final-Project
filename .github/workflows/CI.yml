name: QuickPOS CI Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop, feature/* ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: Install Composer
      run: composer install --no-progress
    - name: PHP Syntax Check
      run: find . -name ".php" -not -path "./vendor/" -exec php -l {} \;
    - name: PHP CodeSniffer
      run: vendor/bin/phpcs --standard=PSR12 src/ --ignore=vendor || true
    - name: PHPStan Static Analysis
      run: vendor/bin/phpstan analyse src/ --level=3 || true

  tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
    - uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: Install Composer
      run: composer install --no-progress
    - name: Start PHP Server
      run: php -S localhost:8000 -t public/ &
    - name: Run PHPUnit Tests
      run: vendor/bin/phpunit --testdox tests/ || true

  commit-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Validate Jira IDs
      run: |
        COMMITS=$(git log origin/develop..HEAD --oneline)
        if echo "$COMMITS" | grep -qE '\[(SFP|POS)-[0-9]+\]'; then
          echo "✅ Valid commit messages"
        else
          echo "⚠️ No Jira ID found"
        fi
